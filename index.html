<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>نادي الترقي — الرئيسية</title>
  <style>
    :root {
      --BrandPrimary:#0D47A1;--WarmPaper:#F6F3EE;--CardWhite:#fff;--CopperUI:#B05920;--Ink:#0B1220;
      --Slate:#22324A;--DividerLine:#E0DBD4;--ControlBorder:#8A7C6E;--MintText:#00796B;--Skeleton:#E0D7CC;--Error:#B3261E;
    }
    *{box-sizing:border-box}body{margin:0;font-family:"IBM Plex Sans Arabic","Noto Sans Arabic UI",sans-serif;background:var(--WarmPaper);color:var(--Ink);line-height:1.6}
    a{color:var(--BrandPrimary);text-decoration:underline;text-underline-offset:3px}
    a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--BrandPrimary);outline-offset:2px;box-shadow:none}
    .wrap{max-width:1120px;margin:auto;padding:0 16px 24px}.top{height:56px;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .brand{display:flex;align-items:center;gap:12px}.mark{width:28px;height:28px;border-radius:999px;background:#D6E4FF;color:var(--BrandPrimary);display:grid;place-items:center;font-weight:700}
    .key{width:48px;height:2px;background:var(--CopperUI)}.menu,.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .menu a,.actions a,.actions button{min-height:44px;padding:0 10px;display:inline-flex;align-items:center;border-radius:14px;border:1px solid transparent}
    .primary{background:var(--BrandPrimary);color:#fff;text-decoration:none}.secondary{border-color:var(--ControlBorder)!important;text-decoration:none}
    .dot{width:6px;height:6px;background:var(--MintText);border-radius:999px;display:inline-block;margin-inline-start:6px}
    .card{background:var(--CardWhite);border:1px solid var(--DividerLine);border-radius:18px;padding:16px}.section{margin-top:24px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.updates .row{display:flex;justify-content:space-between;gap:8px;border:1px solid var(--ControlBorder);border-radius:14px;padding:12px;margin-bottom:12px;background:#fff}
    .footer{margin-top:24px;padding-top:16px;border-top:1px solid var(--DividerLine)}.status{color:var(--Slate)}
    .loading{height:72px;background:var(--Skeleton);border-radius:12px;animation:shimmer 1.2s infinite}
    @keyframes shimmer{0%{opacity:.55}50%{opacity:.95}100%{opacity:.55}}
    @media (max-width:900px){.menu{display:none}}
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top" aria-label="Top Bar">
      <div class="brand">
        <span class="mark" aria-hidden="true">ت</span>
        <a href="/" style="text-decoration:none;color:inherit;min-height:44px;display:inline-flex;align-items:center"><strong style="font-size:18px">نادي الترقي</strong></a>
        <span class="key" aria-hidden="true"></span>
      </div>
      <nav class="menu" aria-label="Global Menu">
        <a href="/">الرئيسية</a>
        <a href="/forum">المنتدى <span class="dot" aria-hidden="true"></span></a>
        <a href="/social">المنصة <span class="dot" aria-hidden="true"></span></a>
        <a href="/news">الأخبار <span class="dot" aria-hidden="true"></span></a>
        <a href="/tags">الوسوم</a>
        <a href="/a22">الدعم</a>
      </nav>
      <div class="actions" id="actions"></div>
    </header>

    <main>
      <section class="section card" aria-labelledby="hero-title">
        <h1 id="hero-title">الرئيسية</h1>
        <p>تعريف بالأجنحة الثلاثة + آخر المحتوى + تحديثات متعددة المصادر.</p>
        <div id="heroCards" class="grid"></div>
      </section>

      <section class="section" aria-labelledby="latest-title">
        <h2 id="latest-title">أحدث محتوى</h2>
        <div id="latestGrid" class="grid"><div class="loading"></div><div class="loading"></div><div class="loading"></div></div>
      </section>

      <section class="section updates" aria-labelledby="updates-title">
        <h2 id="updates-title">تحديثات عبر المنصات</h2>
        <div id="updatesList"><div class="loading"></div></div>
      </section>
    </main>

    <footer class="footer">
      <a href="/a23">الشروط</a> | <a href="/a24">الخصوصية</a> | <a href="/a25">إرشادات المجتمع</a> | <a href="/a22">الدعم</a> | <a href="/a21">اتصل بنا</a>
    </footer>
  </div>

  <script>
    const ROUTES = new Set(['/','/forum','/social','/news','/tags','/a21','/a22','/a23','/a24','/a25','/search','/notifications','/create']);
    const isMember = false;
    const gate = (target) => isMember ? target : `/auth?return=${encodeURIComponent(target)}`;
    const actions = document.getElementById('actions');
    actions.innerHTML = `
      <a href="/search">بحث</a>
      <a href="${gate('/notifications')}">الإشعارات</a>
      <a href="${gate('/create')}">+</a>
      <a href="/auth?return=%2F" class="secondary">تسجيل الدخول</a>
      <a href="/auth?return=%2F" class="primary">إنشاء حساب</a>
    `;

    function normalizeUpdates(items){
      const map = new Map();
      for (const item of items) if (!map.has(item.target_url)) map.set(item.target_url, item);
      return [...map.values()].sort((a,b)=>((b.pinned?2:0)+(b.featured?1:0))-((a.pinned?2:0)+(a.featured?1:0)) || b.time.localeCompare(a.time)).slice(0,6);
    }

    function render(summary){
      const hero = document.getElementById('heroCards');
      hero.innerHTML = summary.wings.map((w)=>`<article class="card"><h3>${w.title}</h3><p>${w.description}</p><a href="${w.href}">فتح ${w.title}</a></article>`).join('');

      const latest = document.getElementById('latestGrid');
      latest.innerHTML = summary.latest.map((i)=>`<article class="card"><p class="status">${i.kind==='thread'?'آخر موضوع':i.kind==='post'?'آخر منشور':'آخر خبر'}</p><h3>${i.title}</h3><a href="${i.href}">فتح العنصر الأصلي</a></article>`).join('');

      const updates = document.getElementById('updatesList');
      const rows = normalizeUpdates(summary.updates);
      if (!rows.length) { updates.innerHTML = `لا يوجد شيء هنا بعد. <a href="/search">استكشف</a>`; return; }
      updates.innerHTML = rows.map((u)=>{
        const safe = ROUTES.has(u.target_url) || /^\/(forum\/t|social\/p|news\/a)\//.test(u.target_url);
        if (u.hidden) return `<article class="row"><div><strong>تم إخفاء العنصر</strong><p>لا يمكنك فتح هذا التحديث الآن.</p></div><button disabled aria-disabled="true">غير متاح</button></article>`;
        return `<article class="row"><div><p>${u.type} · ${u.actor} · <span dir="ltr">${u.time}</span></p><strong>${u.target_title}</strong></div><a href="${safe ? u.target_url : '/a28'}">فتح</a></article>`;
      }).join('');
    }

    async function load(){
      try {
        const timer = setTimeout(()=>{
          document.getElementById('updatesList').innerHTML = 'جارٍ التحميل… إن استمر الأمر أعد المحاولة. <button onclick="load()">إعادة المحاولة</button>';
        },5000);
        const res = await fetch('/home/summary', { credentials: 'include' }); // TODO: replace with /api/home/summary when backend is ready.
        clearTimeout(timer);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        render(await res.json());
      } catch (_) {
        document.getElementById('latestGrid').innerHTML = 'حدث خطأ أثناء التحميل. <button onclick="load()">إعادة المحاولة</button>';
        document.getElementById('updatesList').innerHTML = 'حدث خطأ أثناء التحميل. <button onclick="load()">إعادة المحاولة</button>';
      }
    }
    load();
  </script>
</body>
</html>
