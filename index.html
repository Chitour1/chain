<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>دردشة Firebase</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');
    body { font-family: 'Tajawal', sans-serif; }
    .message-list { max-height: 60vh; }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen">
  <main class="max-w-3xl mx-auto px-4 py-8">
    <header class="bg-white rounded-2xl shadow-sm p-5 mb-4 border border-slate-200">
      <h1 class="text-2xl md:text-3xl font-extrabold text-slate-800">تطبيق دردشة بسيط باستخدام Firebase</h1>
      <p class="text-slate-600 mt-2">يسجل الدخول بشكل مجهول ويعرض الرسائل لحظياً عبر Cloud Firestore.</p>
      <div class="mt-3 text-sm text-slate-500">
        <span class="font-bold">حالة المستخدم:</span>
        <span id="userStatus">جاري تسجيل الدخول...</span>
      </div>
    </header>

    <section class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
      <div id="messages" class="message-list overflow-y-auto p-4 space-y-3"></div>

      <form id="chatForm" class="border-t border-slate-200 p-3 md:p-4 flex gap-2">
        <input
          id="messageInput"
          type="text"
          placeholder="اكتب رسالتك هنا..."
          class="flex-1 rounded-xl border border-slate-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
          maxlength="300"
          required
        />
        <button
          type="submit"
          class="rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold px-5 py-3 transition"
        >
          إرسال
        </button>
      </form>
    </section>

    <p class="text-xs text-slate-500 mt-4 leading-6">
      ملاحظة: أنشئ قاعدة <code>messages</code> في Firestore وعدّل القواعد للسماح بالقراءة/الكتابة للمستخدمين الموثقين.
    </p>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
    import { getAnalytics, isSupported as analyticsSupported } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-analytics.js";
    import {
      getAuth,
      signInAnonymously,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";
    import {
      getFirestore,
      collection,
      addDoc,
      query,
      orderBy,
      limit,
      onSnapshot,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAdcz-tkrqbx1cuUlDgz-SSpZ7E9KpwrCw",
      authDomain: "dohainstitute-c3c3d.firebaseapp.com",
      projectId: "dohainstitute-c3c3d",
      storageBucket: "dohainstitute-c3c3d.firebasestorage.app",
      messagingSenderId: "740345730139",
      appId: "1:740345730139:web:b61d1a9ad7157442909b7e",
      measurementId: "G-V4ND6N58HL"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const userStatus = document.getElementById("userStatus");
    const messagesEl = document.getElementById("messages");
    const chatForm = document.getElementById("chatForm");
    const messageInput = document.getElementById("messageInput");

    let activeUser = null;

    analyticsSupported().then((ok) => {
      if (ok) getAnalytics(app);
    });

    const renderMessage = (docData) => {
      const mine = activeUser && docData.uid === activeUser.uid;
      const wrapper = document.createElement("div");
      wrapper.className = mine ? "flex justify-start" : "flex justify-end";

      const bubble = document.createElement("div");
      bubble.className = mine
        ? "max-w-[85%] md:max-w-[70%] rounded-2xl rounded-tr-sm bg-blue-600 text-white px-4 py-2"
        : "max-w-[85%] md:max-w-[70%] rounded-2xl rounded-tl-sm bg-slate-200 text-slate-800 px-4 py-2";

      const sender = mine ? "أنت" : `مستخدم ${docData.uid.slice(0, 6)}`;
      const text = document.createElement("p");
      text.className = "text-sm leading-6 whitespace-pre-wrap";
      text.textContent = docData.text;

      const meta = document.createElement("p");
      meta.className = mine ? "text-[11px] mt-1 text-blue-100" : "text-[11px] mt-1 text-slate-500";
      meta.textContent = sender;

      bubble.append(meta, text);
      wrapper.appendChild(bubble);
      messagesEl.appendChild(wrapper);
    };

    const chatQuery = query(
      collection(db, "messages"),
      orderBy("createdAt", "asc"),
      limit(100)
    );

    onSnapshot(chatQuery, (snapshot) => {
      messagesEl.innerHTML = "";
      snapshot.forEach((docSnap) => renderMessage(docSnap.data()));
      messagesEl.scrollTop = messagesEl.scrollHeight;
    });

    onAuthStateChanged(auth, (user) => {
      activeUser = user;
      if (user) {
        userStatus.textContent = `متصل (${user.uid.slice(0, 8)})`;
      }
    });

    signInAnonymously(auth).catch((error) => {
      userStatus.textContent = `تعذر تسجيل الدخول: ${error.code}`;
    });

    chatForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const text = messageInput.value.trim();
      if (!text || !activeUser) return;

      await addDoc(collection(db, "messages"), {
        text,
        uid: activeUser.uid,
        createdAt: serverTimestamp()
      });

      messageInput.value = "";
      messageInput.focus();
    });
  </script>
</body>
</html>
